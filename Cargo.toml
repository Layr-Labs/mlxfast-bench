[workspace]
resolver = "2"
members = [
    "crates/bench-protocol",
    "crates/bench-core",
    "crates/bench-runner",
    "crates/benchd",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
bench-protocol = { path = "crates/bench-protocol" }
bench-core = { path = "crates/bench-core" }
bench-runner = { path = "crates/bench-runner" }
