[package]
name = "bench-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Engine Protocol v1 NDJSON-over-stdio adapter SDK: a track engine implements the Engine trait and gets the protocol loop."

[dependencies]
bench-protocol = { path = "../bench-protocol" }
serde_json = "1"

[dev-dependencies]
# The canonical manifest digest rule (Darkbloom runner contract §6.0) lives in
# bench-core. The transcript's hello quotes a digest, so the test computes it
# there rather than restating the rule or pasting a second copy of the manifest.
bench-core = { path = "../bench-core" }
